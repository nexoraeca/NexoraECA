<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Top Arc for NEXORA -->
    <path id="top-arc" d="M 68 250 A 182 182 0 0 1 432 250" fill="none" />
    <!-- Bottom Arc for Education & Career Academy -->
    <path id="bottom-arc" d="M 72 250 A 182 182 0 0 0 428 250" fill="none" />
    
    <!-- Star Definition -->
    <g id="star">
      <polygon points="0,-13 3.8,-4 13,-4 5.5,2 8.5,11 0,6 -8.5,11 -5.5,2 -13,-4 -3.8,-4" fill="#FFFFFF" />
    </g>

    <!-- Linear gradients -->
    <linearGradient id="swooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="50%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#00A6FF" />
    </linearGradient>
  </defs>

  <!-- Outer Deep Navy Circle -->
  <circle cx="250" cy="250" r="242" fill="#0A2558" />
  
  <!-- Outer Thin White Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
  
  <!-- Inner White Disc (creates the ring thickness) -->
  <circle cx="250" cy="250" r="162" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" />

  <!-- Arched Brand Text: NEXORA -->
  <text fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', Roboto, sans-serif" font-weight="900" font-size="58" letter-spacing="4.5">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">NEXORA</textPath>
  </text>

  <!-- Left Star -->
  <use href="#star" x="80" y="238" transform="rotate(-6 80 238)" />

  <!-- Right Star -->
  <use href="#star" x="420" y="238" transform="rotate(6 420 238)" />

  <!-- Arched Subtitle Text: Education & Career Academy -->
  <text fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', Roboto, sans-serif" font-weight="700" font-size="21.5" letter-spacing="1.8">
    <textPath href="#bottom-arc" startOffset="50%" text-anchor="middle">Education &amp; Career Academy</textPath>
  </text>

  <!-- ================= CENTER LOGO EMBLEM ================= -->
  <!-- White Center Field is provided by the inner disc above -->

  <g id="center-emblem">
    <!-- Stylized 'N' Monogram in Navy Blue -->
    <!-- Left Vertical Stem of N -->
    <path d="M 176 205 L 208 205 L 208 306 L 176 306 Z" fill="#0A2558" />
    
    <!-- Diagonal of N -->
    <polygon points="176,205 210,205 301,310 270,310" fill="#0A2558" />

    <!-- Right Vertical Stem of N with tapered pointed bottom -->
    <path d="M 270 205 L 302 205 L 302 328 L 270 345 Z" fill="#0A2558" />

    <!-- Graduation Mortarboard Cap -->
    <!-- Diamond Cap Top -->
    <polygon points="239,140 326,176 239,214 163,176" fill="#0A2558" />
    <!-- White subtle edge highlight -->
    <polyline points="163,176 239,214 326,176" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    
    <!-- Cap Skull Skullband below diamond -->
    <path d="M 188 188 Q 239 212 292 188 L 292 196 Q 239 220 188 196 Z" fill="#0A2558" />

    <!-- Cap Button at top -->
    <ellipse cx="239" cy="176" rx="4.5" ry="3.5" fill="#0088FF" />

    <!-- Tassel Ribbon & Fringe -->
    <path d="M 242 177 Q 300 184 316 202 L 316 226" fill="none" stroke="#0A2558" stroke-width="3" stroke-linecap="round" />
    <polygon points="312,224 320,224 322,238 310,238" fill="#0A2558" />

    <!-- Dynamic Upward Swoop Arrow (Electric Blue with clean White border) -->
    <!-- White outer boundary stroke for separation -->
    <path d="M 156 288 C 150 334 235 348 290 286 L 318 248" fill="none" stroke="#FFFFFF" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="334,204 364,242 320,246" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" />

    <!-- Blue Arrow Body -->
    <path d="M 156 288 C 150 334 235 348 290 286 L 318 248" fill="none" stroke="url(#swooshGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arrowhead -->
    <polygon points="335,205 363,241 321,245" fill="url(#swooshGrad)" />
  </g>
</svg>
